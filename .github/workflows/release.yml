name: Build and Publish

# Pushes to main rebuild the web installer on GitHub Pages.
# Tags starting with "v" also publish a GitHub release with the binaries.
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache arduino cores and libraries
        uses: actions/cache@v5
        with:
          path: |
            ~/.arduino15/packages
            ~/Arduino/libraries
          key: ${{ runner.os }}-arduino-deps-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-arduino-deps-

      - name: Install cores and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install lvgl@8.3.11
          arduino-cli lib install ESP32_Display_Panel@1.0.0
          arduino-cli lib install ESP32_IO_Expander@1.0.1
          arduino-cli lib install esp-lib-utils@0.1.2

      - name: Compile with arduino-cli
        run: |
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,USBMode=hwcdc,CDCOnBoot=cdc,FlashMode=qio,PartitionScheme=custom" --export-binaries knobby

      - name: Prepare web installer
        run: |
          cp knobby/build/esp32.esp32.esp32s3/*.bin web/
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="main-${GITHUB_SHA::7}"
          fi
          sed -i "s/\"latest\"/\"$VERSION\"/g" web/manifest.json

      - name: Upload web installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: web

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web installer artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download web installer artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Zip binaries
        run: |
          cd web
          zip -r ../knobby-swu-firmware-${{ github.ref_name }}.zip knobby.ino.bootloader.bin knobby.ino.partitions.bin boot_app0.bin knobby.ino.bin manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: knobby-swu-firmware-${{ github.ref_name }}.zip
          body: "Install from the browser: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          generate_release_notes: true
